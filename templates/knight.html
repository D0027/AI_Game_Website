<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL ARENA | Neon Knight</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020202; color: #fff; font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; overflow-y: auto; padding-top: 20px; padding-bottom: 50px;
            user-select: none;
        }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at center, #1a001a 0%, #000 100%); }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: -1; opacity: 0.3; }

        /* ── PAGE TRANSITION OVERLAY ── */
        #page-transition {
            position: fixed; inset: 0; z-index: 99999;
            background: #9932cc;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #page-transition.active { opacity: 1; pointer-events: all; }

        .back-btn {
            position: absolute; top: 30px; left: 30px; text-decoration: none;
            color: #9932cc; font-family: 'Orbitron'; font-size: 1rem;
            border: 1px solid #9932cc; padding: 10px 20px; border-radius: 5px;
            transition: 0.3s; background: rgba(153, 50, 204, 0.1);
            cursor: pointer;
        }
        .back-btn:hover { background-color: #9932cc; color: #fff; box-shadow: 0 0 25px #9932cc; }

        h1 { font-family: 'Orbitron'; font-size: 3.5rem; text-shadow: 0 0 20px #9932cc; color: #9932cc; margin-bottom: 30px; margin-top: 40px; }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            border: 2px solid #9932cc;
            box-shadow: 0 0 40px rgba(153, 50, 204, 0.2);
        }

        .square {
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; font-size: 1.2rem;
            cursor: pointer; position: relative;
        }
        .white-sq { background: #222; }
        .black-sq { background: #111; }
        .square:hover { background: #9932cc; color: #fff; }
        .knight-icon { font-size: 2.5rem; color: #fff; text-shadow: 0 0 10px #fff; z-index: 10; pointer-events: none; }
        .visited { background: rgba(153, 50, 204, 0.4) !important; color: #fff; font-size: 0.8rem; }

        #line-canvas { position: absolute; pointer-events: none; top: 0; left: 0; z-index: 5; }
        .board-wrapper { position: relative; }

        .controls-area { margin-top: 30px; display: flex; gap: 20px; }
        button {
            padding: 10px 30px; font-family: 'Orbitron'; font-size: 1rem; color: #fff; background: #9932cc;
            border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 20px #9932cc; transition: 0.3s;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px #9932cc; }
        .btn-guide { background: transparent; border: 2px solid #9932cc; color: #9932cc; }
        .btn-guide:hover { background: #9932cc; color: #fff; }

        /* Achievement toast */
        #achievement-toast {
            position: fixed; bottom: 30px; right: 30px; z-index: 9000;
            background: rgba(153,50,204,0.15); border: 1px solid #9932cc;
            border-radius: 8px; padding: 14px 20px; min-width: 280px;
            font-family: 'Orbitron'; font-size: 0.75rem; color: #9932cc;
            display: flex; align-items: center; gap: 12px;
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(12px);
        }
        #achievement-toast.show { transform: translateX(0); }
        #achievement-toast .ach-icon { font-size: 1.6rem; }
        #achievement-toast .ach-body {}
        #achievement-toast .ach-title { color: #fff; margin-bottom: 2px; }
        #achievement-toast .ach-sub { color: rgba(153,50,204,0.8); font-size: 0.6rem; letter-spacing: 2px; }

        .swal-custom-popup { background: #0a0a0a !important; border: 2px solid #9932cc !important; }
        .swal-custom-title { color: #9932cc !important; font-family: 'Orbitron' !important; }
        .swal-custom-content { color: #ccc !important; font-family: 'Rajdhani' !important; font-size: 1.1rem; text-align: left; }
    </style>
</head>
<body>
    <canvas id="neural-bg"></canvas>
    <div class="scanlines"></div>
    <div id="page-transition"></div>

    <!-- Achievement Toast -->
    <div id="achievement-toast">
        <div class="ach-icon" id="ach-icon">🏆</div>
        <div class="ach-body">
            <div class="ach-title" id="ach-title">ACHIEVEMENT UNLOCKED</div>
            <div class="ach-sub" id="ach-sub">LOADING...</div>
        </div>
    </div>

    <a class="back-btn" id="back-btn">← DASHBOARD</a>
    <h1>NEON KNIGHT</h1>

    <div class="board-wrapper">
        <canvas id="line-canvas" width="404" height="404"></canvas>
        <div id="board"></div>
    </div>

    <div class="controls-area">
        <button class="btn-guide" onclick="showGuide()">MISSION BRIEF</button>
        <button onclick="resetBoard()">CLEAR BOARD</button>
    </div>

    <script>
        // ── WEB AUDIO CONTEXT ──────────────────────────────────
        let audioCtx = null;
        function getAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playWhoosh() {
            try {
                const ctx = getAudio();
                const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
                }
                const src = ctx.createBufferSource();
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass'; filter.frequency.value = 800;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                src.buffer = buf;
                src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                src.start();
            } catch(e) {}
        }

        function playBeep(freq = 880, dur = 0.1) {
            try {
                const ctx = getAudio();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        function playConfirm() {
            playBeep(660, 0.08);
            setTimeout(() => playBeep(880, 0.08), 90);
            setTimeout(() => playBeep(1100, 0.12), 180);
        }

        function playAchievementSound() {
            [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playBeep(f, 0.15), i * 80));
        }

        // ── PAGE TRANSITION ────────────────────────────────────
        const overlay = document.getElementById('page-transition');
        document.getElementById('back-btn').addEventListener('click', (e) => {
            e.preventDefault();
            playWhoosh();
            overlay.classList.add('active');
            setTimeout(() => { window.location.href = '/'; }, 320);
        });

        // ── PARTICLE BURST ON BACK BTN HOVER ──────────────────
        const bgCanvas = document.getElementById('neural-bg');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;

        const backBtn = document.getElementById('back-btn');
        backBtn.addEventListener('mouseenter', spawnBackBtnParticles);

        function spawnBackBtnParticles() {
            const rect = backBtn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const speed = 2.5 + Math.random() * 2.5;
                burstParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1, color: '#9932cc', size: 4 + Math.random() * 3
                });
            }
        }

        let burstParticles = [];

        // ── BACKGROUND PARTICLES ───────────────────────────────
        let bgParticles = [];
        class BgParticle {
            constructor() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() * 1.0) - 0.5;
                this.speedY = (Math.random() * 1.0) - 0.5;
                this.color = '#9932cc';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > bgCanvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > bgCanvas.height) this.speedY *= -1;
            }
            draw() {
                bgCtx.fillStyle = this.color;
                bgCtx.beginPath(); bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); bgCtx.fill();
            }
        }

        function initBg() {
            bgParticles = [];
            for (let i = 0; i < 60; i++) bgParticles.push(new BgParticle());
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            // bg particles
            for (let i = 0; i < bgParticles.length; i++) {
                bgParticles[i].update(); bgParticles[i].draw();
                for (let b = i; b < bgParticles.length; b++) {
                    const dist = (bgParticles[i].x - bgParticles[b].x) ** 2 + (bgParticles[i].y - bgParticles[b].y) ** 2;
                    if (dist < (bgCanvas.width / 7) * (bgCanvas.height / 7)) {
                        bgCtx.strokeStyle = `rgba(153, 50, 204, ${1 - dist / 25000})`;
                        bgCtx.lineWidth = 1;
                        bgCtx.beginPath(); bgCtx.moveTo(bgParticles[i].x, bgParticles[i].y);
                        bgCtx.lineTo(bgParticles[b].x, bgParticles[b].y); bgCtx.stroke();
                    }
                }
            }
            // burst particles
            burstParticles = burstParticles.filter(p => p.life > 0);
            for (const p of burstParticles) {
                p.x += p.vx; p.y += p.vy; p.vy += 0.12;
                p.life -= 0.035;
                bgCtx.globalAlpha = Math.max(0, p.life);
                bgCtx.fillStyle = p.color;
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); bgCtx.fill();
                bgCtx.globalAlpha = 1;
            }
            requestAnimationFrame(animateBg);
        }

        window.addEventListener('resize', () => {
            bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; initBg();
        });
        initBg(); animateBg();

        // ── ACHIEVEMENT SYSTEM ─────────────────────────────────
        const ACHIEVEMENTS = {
            first_tour: { icon: '♞', title: 'FIRST TOUR', sub: 'COMPLETED KNIGHT\'S TOUR' },
            corner_start: { icon: '⬛', title: 'CORNER MASTER', sub: 'STARTED FROM A CORNER' },
            speedrun: { icon: '⚡', title: 'SPEED DEMON', sub: 'TOUR COMPLETE IN RECORD TIME' },
            triple_crown: { icon: '👑', title: 'TRIPLE CROWN', sub: 'COMPLETED 3 TOURS' },
        };

        function unlockAchievement(key) {
            const unlocked = JSON.parse(localStorage.getItem('knight_achievements') || '{}');
            if (unlocked[key]) return;
            unlocked[key] = Date.now();
            localStorage.setItem('knight_achievements', JSON.stringify(unlocked));
            showAchievementToast(ACHIEVEMENTS[key]);
            playAchievementSound();
        }

        function showAchievementToast(ach) {
            const toast = document.getElementById('achievement-toast');
            document.getElementById('ach-icon').textContent = ach.icon;
            document.getElementById('ach-title').textContent = ach.title;
            document.getElementById('ach-sub').textContent = ach.sub;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ── BOARD LOGIC ────────────────────────────────────────
        const boardEl = document.getElementById('board');
        const lineCanvas = document.getElementById('line-canvas');
        const lCtx = lineCanvas.getContext('2d');
        let isRunning = false;
        let tourCount = parseInt(localStorage.getItem('knight_tour_count') || '0');
        let tourStartTime = 0;

        function initBoard() {
            boardEl.innerHTML = '';
            lCtx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
            isRunning = false;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let div = document.createElement('div');
                    div.className = 'square ' + ((r + c) % 2 === 0 ? 'white-sq' : 'black-sq');
                    div.id = `sq-${c}-${r}`;
                    div.onclick = () => runAI(c, r);
                    boardEl.appendChild(div);
                }
            }
        }

        // alias so the clear button works
        function resetBoard() { playBeep(440, 0.05); initBoard(); }

        function runAI(startX, startY) {
            if (isRunning) return;
            isRunning = true;
            tourStartTime = Date.now();

            // Achievement: corner start
            if ((startX === 0 || startX === 7) && (startY === 0 || startY === 7)) {
                unlockAchievement('corner_start');
            }

            playConfirm();

            let startDiv = document.getElementById(`sq-${startX}-${startY}`);
            startDiv.innerHTML = '<span class="knight-icon">♞</span>';

            fetch('/solve_knight', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ start: { x: startX, y: startY } })
            })
            .then(res => res.json())
            .then(data => {
                let path = data.path;
                let i = 0;

                lCtx.lineWidth = 3;
                lCtx.strokeStyle = '#9932cc';
                lCtx.shadowBlur = 10;
                lCtx.shadowColor = '#fff';
                lCtx.lineCap = 'round';
                lCtx.lineJoin = 'round';

                function animateStep() {
                    if (i >= path.length) {
                        isRunning = false;
                        const elapsed = (Date.now() - tourStartTime) / 1000;

                        // Increment tour count
                        tourCount++;
                        localStorage.setItem('knight_tour_count', tourCount);

                        // Achievements
                        unlockAchievement('first_tour');
                        if (elapsed < 12) unlockAchievement('speedrun');
                        if (tourCount >= 3) unlockAchievement('triple_crown');

                        // Also write a general achievement record for the arena
                        const arenaAch = JSON.parse(localStorage.getItem('na_achievements') || '{}');
                        arenaAch['knight_tour'] = Date.now();
                        localStorage.setItem('na_achievements', JSON.stringify(arenaAch));

                        Swal.fire({
                            title: "TOUR COMPLETE",
                            text: `All 64 squares visited in ${elapsed.toFixed(1)}s.`,
                            background: '#0a0a0a', color: '#9932cc', icon: 'success',
                            customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }
                        });
                        return;
                    }

                    let curr = path[i];
                    let div = document.getElementById(`sq-${curr.x}-${curr.y}`);

                    document.querySelectorAll('.knight-icon').forEach(e => e.remove());
                    div.innerHTML = `<span class="knight-icon">♞</span><span style="position:absolute;bottom:2px;right:2px;font-size:10px;">${i + 1}</span>`;
                    div.classList.add('visited');

                    if (i > 0) {
                        let prev = path[i - 1];
                        let x1 = prev.x * 50 + 25, y1 = prev.y * 50 + 25;
                        let x2 = curr.x * 50 + 25, y2 = curr.y * 50 + 25;
                        lCtx.beginPath(); lCtx.moveTo(x1, y1); lCtx.lineTo(x2, y2); lCtx.stroke();
                    }

                    i++;
                    setTimeout(animateStep, 150);
                }
                animateStep();
            });
        }

        function showGuide() {
            playBeep(660, 0.06);
            Swal.fire({
                title: 'MISSION BRIEF',
                html: `
                    <ul style="list-style:none;padding:0;text-align:left;">
                        <li style="margin-bottom:10px;">► <strong>GOAL:</strong> The Knight's Tour. Visit every square on the 8x8 board exactly once.</li>
                        <li style="margin-bottom:10px;">► <strong>CONTROLS:</strong> Click any square to place the Knight and start the algorithm.</li>
                        <li style="margin-bottom:10px;">► <strong>AI ASSIST:</strong> Uses <strong>Warnsdorff's Rule</strong> — always moves to the square with fewest onward moves.</li>
                    </ul>
                `,
                background: '#0a0a0a', color: '#9932cc',
                confirmButtonText: 'ACKNOWLEDGED',
                confirmButtonColor: '#9932cc',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', content: 'swal-custom-content' }
            });
        }

        initBoard();
    </script>
</body>
</html>
