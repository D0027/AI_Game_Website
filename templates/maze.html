<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL ARENA | Neon Maze</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020202; color: #fff; font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; overflow-y: auto; padding-top: 20px; padding-bottom: 50px;
        }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at center, #1a0f00 0%, #000 100%); }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: -1; opacity: 0.3; }

        .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; color: #ff9900; font-family: 'Orbitron'; font-size: 1rem; border: 1px solid #ff9900; padding: 10px 20px; border-radius: 5px; transition: 0.3s; background: rgba(255, 153, 0, 0.1); }
        .back-btn:hover { background-color: #ff9900; color: #000; box-shadow: 0 0 25px #ff9900; }

        h1 { font-family: 'Orbitron'; font-size: 3.5rem; text-shadow: 0 0 20px #ff9900; color: #ff9900; margin-bottom: 10px; margin-top: 40px; }
        
        .status-bar { font-family: 'Orbitron'; font-size: 1.5rem; margin-bottom: 15px; color: #fff; }
        
        #game-container {
            position: relative;
            padding: 5px;
            background: rgba(20, 10, 0, 0.5);
            border: 2px solid #ff9900;
            box-shadow: 0 0 40px rgba(255, 153, 0, 0.2);
            border-radius: 5px;
        }

        canvas { background: #000; display: block; }

        .controls-area { margin-top: 20px; display: flex; gap: 20px; }
        button {
            padding: 10px 30px; font-family: 'Orbitron'; font-size: 1rem; color: #000; background: #ff9900;
            border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 20px #ff9900; transition: 0.3s;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px #ff9900; }

        .swal-custom-popup { background: #0a0a0a !important; border: 2px solid #ff9900 !important; }
        .swal-custom-title { color: #ff9900 !important; font-family: 'Orbitron' !important; }
    </style>
</head>
<body>
    <canvas id="neural-bg"></canvas>
    <div class="scanlines"></div>

    <a href="/" class="back-btn">← DASHBOARD</a>
    <h1>NEON MAZE</h1>
    <div class="status-bar" id="status">PRESS ANY ARROW TO START RACE</div>

    <div id="game-container">
        <canvas id="mazeCanvas" width="600" height="600"></canvas>
    </div>

    <div class="controls-area">
        <button onclick="location.reload()">NEW MAZE</button>
    </div>

    <script>
        const bgCanvas = document.getElementById('neural-bg'); const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        let particles=[]; class Particle{constructor(){this.x=Math.random()*bgCanvas.width;this.y=Math.random()*bgCanvas.height;this.size=Math.random()*2;this.speedX=(Math.random()*1.5)-0.75;this.speedY=(Math.random()*1.5)-0.75;this.color='#ff9900';}update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>bgCanvas.width)this.speedX*=-1;if(this.y<0||this.y>bgCanvas.height)this.speedY*=-1;}draw(){bgCtx.fillStyle=this.color;bgCtx.beginPath();bgCtx.arc(this.x,this.y,this.size,0,Math.PI*2);bgCtx.fill();}}
        function init(){particles=[];for(let i=0;i<80;i++)particles.push(new Particle());}
        function animate(){bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);for(let i=0;i<particles.length;i++){particles[i].update();particles[i].draw();connect(i);}requestAnimationFrame(animate);}
        function connect(a){for(let b=a;b<particles.length;b++){let dist=((particles[a].x-particles[b].x)**2+(particles[a].y-particles[b].y)**2);if(dist<(bgCanvas.width/7)*(bgCanvas.height/7)){bgCtx.strokeStyle='rgba(255, 153, 0,'+(1-dist/20000)+')';bgCtx.lineWidth=1;bgCtx.beginPath();bgCtx.moveTo(particles[a].x,particles[a].y);bgCtx.lineTo(particles[b].x,particles[b].y);bgCtx.stroke();}}}
        window.addEventListener('resize',()=>{bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight;init();});init();animate();
    </script>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        
        // Maze Config
        const cols = 21; // Odd numbers work best for this generation algo
        const rows = 21;
        const cellSize = canvas.width / cols;
        let maze = []; // 1=Wall, 0=Path
        
        // Players
        let player = {r: 1, c: 1, color: '#ffcc00'};
        let ai = {r: 1, c: 1, color: '#ff0055', path: [], step: 0};
        let end = {r: rows-2, c: cols-2};
        
        let raceStarted = false;
        let gameOver = false;

        function initMaze() {
            // Fill with walls
            maze = Array(rows).fill().map(() => Array(cols).fill(1));
            
            // Generate Maze (Recursive Backtracker)
            function carve(r, c) {
                maze[r][c] = 0;
                const directions = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
                
                for(let [dr, dc] of directions) {
                    let nr = r + dr, nc = c + dc;
                    if(nr > 0 && nr < rows-1 && nc > 0 && nc < cols-1 && maze[nr][nc] === 1) {
                        maze[r + dr/2][c + dc/2] = 0; // Carve wall between
                        carve(nr, nc);
                    }
                }
            }
            carve(1, 1);
            maze[rows-2][cols-2] = 0; // Ensure exit is open
            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Walls
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    if(maze[r][c] === 1) {
                        ctx.fillStyle = '#ff9900';
                        ctx.shadowBlur = 10; ctx.shadowColor = '#ff9900';
                        ctx.fillRect(c*cellSize, r*cellSize, cellSize, cellSize);
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // Draw Goal
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(end.c*cellSize + 5, end.r*cellSize + 5, cellSize - 10, cellSize - 10);

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15; ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.arc(player.c*cellSize + cellSize/2, player.r*cellSize + cellSize/2, cellSize/3, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw AI
            ctx.fillStyle = ai.color;
            ctx.shadowBlur = 15; ctx.shadowColor = ai.color;
            ctx.beginPath();
            ctx.arc(ai.c*cellSize + cellSize/2, ai.r*cellSize + cellSize/2, cellSize/4, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function startRace() {
            if(raceStarted) return;
            raceStarted = true;
            document.getElementById('status').innerText = "RACE IN PROGRESS...";
            
            // Get AI Path from Python
            fetch('/solve_maze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ grid: maze, start: [1,1], end: [end.r, end.c] })
            })
            .then(res => res.json())
            .then(data => {
                ai.path = data.path;
                moveAI();
            });
        }

        function moveAI() {
            if(gameOver) return;
            if(ai.step < ai.path.length) {
                let nextPos = ai.path[ai.step];
                ai.r = nextPos[0];
                ai.c = nextPos[1];
                ai.step++;
                draw();
                
                if(ai.r === end.r && ai.c === end.c) {
                    endGame("AI WINS! (DFS ALGORITHM)");
                } else {
                    setTimeout(moveAI, 150); // AI Speed (Adjust to make it fair)
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if(gameOver) return;
            if(!raceStarted && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) startRace();

            let nr = player.r, nc = player.c;
            if(e.key === 'ArrowUp') nr--;
            if(e.key === 'ArrowDown') nr++;
            if(e.key === 'ArrowLeft') nc--;
            if(e.key === 'ArrowRight') nc++;

            if(maze[nr][nc] === 0) {
                player.r = nr;
                player.c = nc;
                draw();
                if(player.r === end.r && player.c === end.c) {
                    endGame("YOU WIN!");
                }
            }
        });

        function endGame(msg) {
            gameOver = true;
            let col = msg === "YOU WIN!" ? "#00ff00" : "#ff0055";
            let ico = msg === "YOU WIN!" ? "success" : "error";
            
            Swal.fire({
                title: msg,
                background: '#0a0a0a', color: col, icon: ico,
                confirmButtonText: 'PLAY AGAIN',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }
            }).then(() => location.reload());
        }

        initMaze();
    </script>

<!-- ═══════════════════════════════════════════════
     NEURAL ARENA — UNIVERSAL ENHANCEMENTS v1.0
     1) Page Transition  2) Btn Particle Burst
     3) UI Sounds        4) Achievement System
═══════════════════════════════════════════════ -->
<div id="na-transition-overlay" style="
  position:fixed;inset:0;z-index:999999;
  background:#000;opacity:0;pointer-events:none;
  transition:opacity .3s ease;
"></div>

<div id="na-achievement-toast" style="
  position:fixed;bottom:28px;right:28px;z-index:999998;
  background:rgba(0,0,0,.92);border:1px solid var(--ac,#00ffcc);
  border-radius:8px;padding:12px 18px;font-family:'Orbitron',monospace;
  font-size:.72rem;color:var(--ac,#00ffcc);letter-spacing:2px;
  box-shadow:0 0 24px var(--ac,#00ffcc);
  opacity:0;transform:translateY(16px);
  transition:opacity .35s,transform .35s;pointer-events:none;
  display:flex;align-items:center;gap:10px;
"></div>

<script>
(function(){
'use strict';

/* ── 0. Detect accent colour from back-btn ─────────────────────────── */
const accentDetect = () => {
  const bb = document.querySelector('.back-btn');
  if(!bb) return '#00ffcc';
  const s = getComputedStyle(bb);
  return s.color || '#00ffcc';
};
const ACCENT = accentDetect();
document.documentElement.style.setProperty('--ac', ACCENT);

/* ── 1. PAGE TRANSITION ────────────────────────────────────────────── */
const overlay = document.getElementById('na-transition-overlay');
overlay.style.borderColor = ACCENT;

function navigateWithTransition(href){
  if(!href || href === '#') return;
  overlay.style.pointerEvents = 'all';
  overlay.style.opacity = '1';
  setTimeout(() => { window.location.href = href; }, 310);
}

// Intercept back-btn clicks
document.addEventListener('click', e => {
  const btn = e.target.closest('.back-btn');
  if(btn && btn.href){
    e.preventDefault();
    playWhoosh();
    navigateWithTransition(btn.href);
  }
}, true);

// Fade-in on arrival
window.addEventListener('DOMContentLoaded', () => {
  overlay.style.transition = 'none';
  overlay.style.opacity = '1';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.style.transition = 'opacity .35s ease';
      overlay.style.opacity = '0';
    });
  });
});

/* ── 2. BACK-BTN HOVER PARTICLE BURST ──────────────────────────────── */
const bgCv = document.getElementById('neural-bg');

function spawnBurstParticle(x, y){
  if(!bgCv) return;
  const angle = Math.random() * Math.PI * 2;
  const speed = 2 + Math.random() * 3.5;
  const life  = { v: 1 };
  const px = x - bgCv.getBoundingClientRect().left;
  const py = y - bgCv.getBoundingClientRect().top;
  let vx = Math.cos(angle) * speed;
  let vy = Math.sin(angle) * speed;
  let cx = px, cy = py;
  const ctx2 = bgCv.getContext('2d');

  function draw(){
    if(life.v <= 0) return;
    ctx2.save();
    ctx2.globalAlpha = life.v * 0.8;
    ctx2.fillStyle = ACCENT;
    ctx2.shadowColor = ACCENT;
    ctx2.shadowBlur = 6;
    ctx2.beginPath();
    ctx2.arc(cx, cy, 3 * life.v, 0, Math.PI*2);
    ctx2.fill();
    ctx2.restore();
    cx += vx; cy += vy;
    vx *= 0.92; vy *= 0.92;
    life.v -= 0.045;
    requestAnimationFrame(draw);
  }
  draw();
}

document.addEventListener('mouseenter', e => {
  const btn = e.target.closest('.back-btn');
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top  + r.height/2;
  for(let i=0; i<8; i++) spawnBurstParticle(cx, cy);
}, true);

/* ── 3. UI SOUNDS (Web Audio, no files) ────────────────────────────── */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx) try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  return _audioCtx;
}

function playWhoosh(){
  const ac = getAudioCtx(); if(!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * .25, ac.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800; f.Q.value=0.5;
  const g = ac.createGain(); g.gain.setValueAtTime(.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.25);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}

function playBeep(freq=1100, dur=.09){
  const ac = getAudioCtx(); if(!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.6, ac.currentTime+dur);
  g.gain.setValueAtTime(.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur);
}

function playConfirm(){
  playBeep(880, .06);
  setTimeout(()=>playBeep(1320,.06), 70);
}

// Wire sounds to AI / action buttons (exclude back-btn — already has whoosh)
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  if(btn.closest('#na-achievement-toast')) return;
  const txt = (btn.innerText||'').toLowerCase();
  // whoosh for nav/reset, confirm beep for AI/action
  if(txt.includes('ai') || txt.includes('run') || txt.includes('solve') ||
     txt.includes('evolve') || txt.includes('decrypt') || txt.includes('submit') ||
     txt.includes('recursion') || txt.includes('pilot') || txt.includes('tactical') ||
     txt.includes('encrypt') || txt.includes('cluster') || txt.includes('paint') ||
     txt.includes('step') || txt.includes('next') || txt.includes('shield') ||
     txt.includes('scan') || txt.includes('tour')) {
    playConfirm();
  } else if(txt.includes('reset') || txt.includes('restart') || txt.includes('reboot') ||
            txt.includes('clear') || txt.includes('new') || txt.includes('scramble') ||
            txt.includes('randomize') || txt.includes('reload')) {
    playWhoosh();
  } else {
    playBeep(660, .05); // generic click tick
  }
}, true);

/* ── 4. ACHIEVEMENT SYSTEM ─────────────────────────────────────────── */
const toast = document.getElementById('na-achievement-toast');
let toastTimer = null;

function showAchievement(icon, title, desc){
  toast.innerHTML = `<span style="font-size:1.4rem">${icon}</span><div><div style="color:var(--ac,#00ffcc);letter-spacing:2px">${title}</div><div style="color:#aaa;font-size:.62rem;margin-top:2px;letter-spacing:1px">${desc}</div></div>`;
  toast.style.opacity = '1';
  toast.style.transform = 'translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(16px)';
  }, 3500);
}

function unlockAchievement(key, icon, title, desc){
  const stored = JSON.parse(localStorage.getItem('na_achievements') || '{}');
  if(stored[key]) return false; // already earned
  stored[key] = { ts: Date.now(), title, desc };
  localStorage.setItem('na_achievements', JSON.stringify(stored));
  showAchievement(icon, title, desc);
  return true;
}

// Expose globally so per-game code can call it
window.NA = window.NA || {};
window.NA.unlockAchievement = unlockAchievement;
window.NA.playBeep     = playBeep;
window.NA.playConfirm  = playConfirm;
window.NA.playWhoosh   = playWhoosh;
window.NA.navigateTo   = navigateWithTransition;

})();
</script>


<script>
/* maze achievements */
(function(){
  let playerStarted = false;
  document.addEventListener('keydown', e => {
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
      if(!playerStarted){
        playerStarted = true;
        window.NA.unlockAchievement('maze_start','🗺️','NAVIGATOR','Entered the maze!');
      }
    }
  });
  const origEnd = window.endGame;
  if(origEnd) window.endGame = function(msg){
    if(msg === 'YOU WIN!') window.NA.unlockAchievement('maze_win','🏆','MAZE MASTER','Beat the DFS AI in the maze!');
    origEnd(msg);
  };
})();
</script>

</body>
</html>
