<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL ARENA | Neon Hanoi</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020202; color: #fff; font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; overflow-y: auto; padding-top: 20px; padding-bottom: 50px;
            user-select: none;
        }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at center, #1a1500 0%, #000 100%); }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: -1; opacity: 0.3; }

        .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; color: #ffd700; font-family: 'Orbitron'; font-size: 1rem; border: 1px solid #ffd700; padding: 10px 20px; border-radius: 5px; transition: 0.3s; background: rgba(255, 215, 0, 0.1); }
        .back-btn:hover { background-color: #ffd700; color: #000; box-shadow: 0 0 25px #ffd700; }

        h1 { font-family: 'Orbitron'; font-size: 3.5rem; text-shadow: 0 0 20px #ffd700; color: #ffd700; margin-bottom: 10px; margin-top: 40px; }
        .status-bar { font-family: 'Orbitron'; font-size: 1.5rem; margin-bottom: 30px; color: #fff; }

        /* GAME AREA */
        .game-area {
            display: flex; justify-content: center; gap: 50px; margin-top: 20px;
            border-bottom: 5px solid #ffd700; padding-bottom: 0; padding-left: 50px; padding-right: 50px;
        }

        .tower-container {
            width: 180px; height: 300px;
            position: relative;
            display: flex; flex-direction: column-reverse; align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .tower-container:hover::after { background: #ffd700; box-shadow: 0 0 20px #ffd700; }

        /* The Rod */
        .tower-container::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 10px; height: 280px; background: #333; border-radius: 5px 5px 0 0;
            z-index: -1; transition: 0.3s;
        }

        .disk {
            height: 35px; border-radius: 10px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            margin-bottom: 2px;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .disk.selected { background: #ffd700; box-shadow: 0 0 25px #ffd700; transform: translateY(-20px); }

        .controls-area { margin-top: 40px; display: flex; gap: 20px; }
        button {
            padding: 10px 30px; font-family: 'Orbitron'; font-size: 1rem; color: #000; background: #ffd700;
            border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 20px #ffd700; transition: 0.3s;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px #ffd700; }
        
        .btn-guide { background: transparent; border: 2px solid #ffd700; color: #ffd700; }
        .btn-guide:hover { background: #ffd700; color: #000; }

        .swal-custom-popup { background: #0a0a0a !important; border: 2px solid #ffd700 !important; }
        .swal-custom-title { color: #ffd700 !important; font-family: 'Orbitron' !important; }
        .swal-custom-content { color: #ccc !important; font-family: 'Rajdhani' !important; font-size: 1.1rem; text-align: left;}
    </style>
</head>
<body>
    <canvas id="neural-bg"></canvas>
    <div class="scanlines"></div>

    <a href="/" class="back-btn">← DASHBOARD</a>
    <h1>NEON HANOI</h1>
    <div class="status-bar">MOVES: <span id="moves">0</span></div>

    <div class="game-area">
        <div class="tower-container" id="tower-0" onclick="clickTower(0)"></div>
        <div class="tower-container" id="tower-1" onclick="clickTower(1)"></div>
        <div class="tower-container" id="tower-2" onclick="clickTower(2)"></div>
    </div>

    <div class="controls-area">
        <button class="btn-guide" onclick="showGuide()">MISSION BRIEF</button>
        <button onclick="initGame()">RESET SYSTEM</button>
        <button onclick="runAI()">AI RECURSION</button>
    </div>

    <script>
        const bgCanvas = document.getElementById('neural-bg'); const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        let particles=[]; class Particle{constructor(){this.x=Math.random()*bgCanvas.width;this.y=Math.random()*bgCanvas.height;this.size=Math.random()*2;this.speedX=(Math.random()*1.0)-0.5;this.speedY=(Math.random()*1.0)-0.5;this.color='#ffd700';}update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>bgCanvas.width)this.speedX*=-1;if(this.y<0||this.y>bgCanvas.height)this.speedY*=-1;}draw(){bgCtx.fillStyle=this.color;bgCtx.beginPath();bgCtx.arc(this.x,this.y,this.size,0,Math.PI*2);bgCtx.fill();}}
        function init(){particles=[];for(let i=0;i<60;i++)particles.push(new Particle());}
        function animate(){bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);for(let i=0;i<particles.length;i++){particles[i].update();particles[i].draw();connect(i);}requestAnimationFrame(animate);}
        function connect(a){for(let b=a;b<particles.length;b++){let dist=((particles[a].x-particles[b].x)**2+(particles[a].y-particles[b].y)**2);if(dist<(bgCanvas.width/7)*(bgCanvas.height/7)){bgCtx.strokeStyle='rgba(255, 215, 0,'+(1-dist/25000)+')';bgCtx.lineWidth=1;bgCtx.beginPath();bgCtx.moveTo(particles[a].x,particles[a].y);bgCtx.lineTo(particles[b].x,particles[b].y);bgCtx.stroke();}}}
        window.addEventListener('resize',()=>{bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight;init();});init();animate();
    </script>

    <script>
        const DISK_COUNT = 5;
        let towers = [[], [], []]; // 0, 1, 2
        let selectedDisk = null;
        let selectedTowerIdx = -1;
        let moveCount = 0;
        let isProcessing = false;

        function initGame() {
            towers = [[], [], []];
            // Create Disks (Largest to Smallest)
            for(let i = DISK_COUNT; i >= 1; i--) {
                towers[0].push(i);
            }
            selectedDisk = null;
            selectedTowerIdx = -1;
            moveCount = 0;
            isProcessing = false;
            updateUI();
        }

        function updateUI() {
            document.getElementById('moves').innerText = moveCount;
            
            for(let i=0; i<3; i++) {
                let div = document.getElementById(`tower-${i}`);
                div.innerHTML = '';
                towers[i].forEach(size => {
                    let disk = document.createElement('div');
                    disk.className = 'disk';
                    disk.style.width = (40 + (size * 25)) + 'px'; // Dynamic width
                    if(selectedDisk === size && selectedTowerIdx === i) disk.classList.add('selected');
                    div.appendChild(disk);
                });
            }
        }

        function clickTower(idx) {
            if(isProcessing) return;

            // Deselect
            if(selectedTowerIdx === idx) {
                selectedDisk = null;
                selectedTowerIdx = -1;
                updateUI();
                return;
            }

            // Select
            if(selectedDisk === null) {
                if(towers[idx].length > 0) {
                    selectedTowerIdx = idx;
                    selectedDisk = towers[idx][towers[idx].length - 1]; // Top disk
                    updateUI();
                }
            } 
            // Move
            else {
                let targetTop = towers[idx].length > 0 ? towers[idx][towers[idx].length - 1] : 999;
                
                if(selectedDisk < targetTop) {
                    // Valid Move
                    towers[selectedTowerIdx].pop();
                    towers[idx].push(selectedDisk);
                    moveCount++;
                    selectedDisk = null;
                    selectedTowerIdx = -1;
                    updateUI();
                    checkWin();
                } else {
                    // Invalid Move animation
                    let tDiv = document.getElementById(`tower-${idx}`);
                    tDiv.style.backgroundColor = 'rgba(255,0,0,0.2)';
                    setTimeout(() => tDiv.style.backgroundColor = 'transparent', 200);
                }
            }
        }

        function checkWin() {
            if(towers[2].length === DISK_COUNT) {
                Swal.fire({
                    title: "SEQUENCE COMPLETE",
                    text: `Solved in ${moveCount} moves.`,
                    background: '#0a0a0a', color: '#ffd700', icon: 'success',
                    confirmButtonText: 'RESTART',
                    customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }
                }).then(initGame);
            }
        }

        function showGuide() {
            Swal.fire({
                title: 'MISSION BRIEF',
                html: `
                    <ul style="list-style: none; padding: 0; text-align: left;">
                        <li style="margin-bottom: 10px;">► <strong>GOAL:</strong> Move the stack of disks from the Left Tower to the Right Tower.</li>
                        <li style="margin-bottom: 10px;">► <strong>RULES:</strong> 
                            <br>1. Only one disk can be moved at a time.
                            <br>2. A larger disk cannot be placed on top of a smaller disk.
                        </li>
                        <li style="margin-bottom: 10px;">► <strong>AI ASSIST:</strong> The AI uses a recursive algorithm to solve this in the minimum possible moves ($2^n - 1$).</li>
                    </ul>
                `,
                background: '#0a0a0a', color: '#ffd700',
                confirmButtonText: 'ACKNOWLEDGED',
                confirmButtonColor: '#ffd700',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', content: 'swal-custom-content' }
            });
        }

        // --- AI LOGIC ---
        function runAI() {
            if(isProcessing) return;
            initGame(); // Reset to clean state for AI
            isProcessing = true;

            fetch('/solve_hanoi', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ disks: DISK_COUNT })
            })
            .then(res => res.json())
            .then(moves => {
                let i = 0;
                function playNext() {
                    if(i >= moves.length) {
                        isProcessing = false;
                        checkWin();
                        return;
                    }
                    
                    let move = moves[i];
                    let disk = towers[move.from].pop();
                    towers[move.to].push(disk);
                    moveCount++;
                    updateUI();
                    
                    i++;
                    setTimeout(playNext, 300); // Animation speed
                }
                playNext();
            });
        }

        initGame();
    </script>

<!-- ═══════════════════════════════════════════════
     NEURAL ARENA — UNIVERSAL ENHANCEMENTS v1.0
     1) Page Transition  2) Btn Particle Burst
     3) UI Sounds        4) Achievement System
═══════════════════════════════════════════════ -->
<div id="na-transition-overlay" style="
  position:fixed;inset:0;z-index:999999;
  background:#000;opacity:0;pointer-events:none;
  transition:opacity .3s ease;
"></div>

<div id="na-achievement-toast" style="
  position:fixed;bottom:28px;right:28px;z-index:999998;
  background:rgba(0,0,0,.92);border:1px solid var(--ac,#00ffcc);
  border-radius:8px;padding:12px 18px;font-family:'Orbitron',monospace;
  font-size:.72rem;color:var(--ac,#00ffcc);letter-spacing:2px;
  box-shadow:0 0 24px var(--ac,#00ffcc);
  opacity:0;transform:translateY(16px);
  transition:opacity .35s,transform .35s;pointer-events:none;
  display:flex;align-items:center;gap:10px;
"></div>

<script>
(function(){
'use strict';

/* ── 0. Detect accent colour from back-btn ─────────────────────────── */
const accentDetect = () => {
  const bb = document.querySelector('.back-btn');
  if(!bb) return '#00ffcc';
  const s = getComputedStyle(bb);
  return s.color || '#00ffcc';
};
const ACCENT = accentDetect();
document.documentElement.style.setProperty('--ac', ACCENT);

/* ── 1. PAGE TRANSITION ────────────────────────────────────────────── */
const overlay = document.getElementById('na-transition-overlay');
overlay.style.borderColor = ACCENT;

function navigateWithTransition(href){
  if(!href || href === '#') return;
  overlay.style.pointerEvents = 'all';
  overlay.style.opacity = '1';
  setTimeout(() => { window.location.href = href; }, 310);
}

// Intercept back-btn clicks
document.addEventListener('click', e => {
  const btn = e.target.closest('.back-btn');
  if(btn && btn.href){
    e.preventDefault();
    playWhoosh();
    navigateWithTransition(btn.href);
  }
}, true);

// Fade-in on arrival
window.addEventListener('DOMContentLoaded', () => {
  overlay.style.transition = 'none';
  overlay.style.opacity = '1';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.style.transition = 'opacity .35s ease';
      overlay.style.opacity = '0';
    });
  });
});

/* ── 2. BACK-BTN HOVER PARTICLE BURST ──────────────────────────────── */
const bgCv = document.getElementById('neural-bg');

function spawnBurstParticle(x, y){
  if(!bgCv) return;
  const angle = Math.random() * Math.PI * 2;
  const speed = 2 + Math.random() * 3.5;
  const life  = { v: 1 };
  const px = x - bgCv.getBoundingClientRect().left;
  const py = y - bgCv.getBoundingClientRect().top;
  let vx = Math.cos(angle) * speed;
  let vy = Math.sin(angle) * speed;
  let cx = px, cy = py;
  const ctx2 = bgCv.getContext('2d');

  function draw(){
    if(life.v <= 0) return;
    ctx2.save();
    ctx2.globalAlpha = life.v * 0.8;
    ctx2.fillStyle = ACCENT;
    ctx2.shadowColor = ACCENT;
    ctx2.shadowBlur = 6;
    ctx2.beginPath();
    ctx2.arc(cx, cy, 3 * life.v, 0, Math.PI*2);
    ctx2.fill();
    ctx2.restore();
    cx += vx; cy += vy;
    vx *= 0.92; vy *= 0.92;
    life.v -= 0.045;
    requestAnimationFrame(draw);
  }
  draw();
}

document.addEventListener('mouseenter', e => {
  const btn = e.target.closest('.back-btn');
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top  + r.height/2;
  for(let i=0; i<8; i++) spawnBurstParticle(cx, cy);
}, true);

/* ── 3. UI SOUNDS (Web Audio, no files) ────────────────────────────── */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx) try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  return _audioCtx;
}

function playWhoosh(){
  const ac = getAudioCtx(); if(!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * .25, ac.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800; f.Q.value=0.5;
  const g = ac.createGain(); g.gain.setValueAtTime(.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.25);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}

function playBeep(freq=1100, dur=.09){
  const ac = getAudioCtx(); if(!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.6, ac.currentTime+dur);
  g.gain.setValueAtTime(.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur);
}

function playConfirm(){
  playBeep(880, .06);
  setTimeout(()=>playBeep(1320,.06), 70);
}

// Wire sounds to AI / action buttons (exclude back-btn — already has whoosh)
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  if(btn.closest('#na-achievement-toast')) return;
  const txt = (btn.innerText||'').toLowerCase();
  // whoosh for nav/reset, confirm beep for AI/action
  if(txt.includes('ai') || txt.includes('run') || txt.includes('solve') ||
     txt.includes('evolve') || txt.includes('decrypt') || txt.includes('submit') ||
     txt.includes('recursion') || txt.includes('pilot') || txt.includes('tactical') ||
     txt.includes('encrypt') || txt.includes('cluster') || txt.includes('paint') ||
     txt.includes('step') || txt.includes('next') || txt.includes('shield') ||
     txt.includes('scan') || txt.includes('tour')) {
    playConfirm();
  } else if(txt.includes('reset') || txt.includes('restart') || txt.includes('reboot') ||
            txt.includes('clear') || txt.includes('new') || txt.includes('scramble') ||
            txt.includes('randomize') || txt.includes('reload')) {
    playWhoosh();
  } else {
    playBeep(660, .05); // generic click tick
  }
}, true);

/* ── 4. ACHIEVEMENT SYSTEM ─────────────────────────────────────────── */
const toast = document.getElementById('na-achievement-toast');
let toastTimer = null;

function showAchievement(icon, title, desc){
  toast.innerHTML = `<span style="font-size:1.4rem">${icon}</span><div><div style="color:var(--ac,#00ffcc);letter-spacing:2px">${title}</div><div style="color:#aaa;font-size:.62rem;margin-top:2px;letter-spacing:1px">${desc}</div></div>`;
  toast.style.opacity = '1';
  toast.style.transform = 'translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(16px)';
  }, 3500);
}

function unlockAchievement(key, icon, title, desc){
  const stored = JSON.parse(localStorage.getItem('na_achievements') || '{}');
  if(stored[key]) return false; // already earned
  stored[key] = { ts: Date.now(), title, desc };
  localStorage.setItem('na_achievements', JSON.stringify(stored));
  showAchievement(icon, title, desc);
  return true;
}

// Expose globally so per-game code can call it
window.NA = window.NA || {};
window.NA.unlockAchievement = unlockAchievement;
window.NA.playBeep     = playBeep;
window.NA.playConfirm  = playConfirm;
window.NA.playWhoosh   = playWhoosh;
window.NA.navigateTo   = navigateWithTransition;

})();
</script>


<script>
/* hanoi achievements */
(function(){
  const origClick = window.clickTower;
  let hanoimoves = 0;
  if(origClick) window.clickTower = function(idx){
    hanoimoves++;
    if(hanoimoves === 1) window.NA.unlockAchievement('hanoi_first','🏗️','FIRST MOVE','Made first tower move!');
    origClick(idx);
  };
  const origCheck = window.checkWin;
  if(origCheck) window.checkWin = function(){
    if(window.towers && window.towers[2] && window.towers[2].length === 5){
      window.NA.unlockAchievement('hanoi_win','🏆','TOWER MASTER','Completed Towers of Hanoi!');
      if(window.moveCount <= 31) window.NA.unlockAchievement('hanoi_optimal','⚡','OPTIMAL','Solved in minimum moves!');
    }
    origCheck();
  };
  document.querySelector('button[onclick="runAI()"]')?.addEventListener('click', () => {
    window.NA.unlockAchievement('hanoi_ai','🤖','RECURSIVE MIND','Watched AI solve recursively!');
  });
})();
</script>

</body>
</html>
