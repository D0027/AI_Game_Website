<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL ARENA | Neon Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020202; color: #fff; font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; overflow-y: auto; padding-top: 20px; padding-bottom: 50px;
            user-select: none;
        }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at center, #1a0011 0%, #000 100%); }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: -1; opacity: 0.3; }

        .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; color: #ff0099; font-family: 'Orbitron'; font-size: 1rem; border: 1px solid #ff0099; padding: 10px 20px; border-radius: 5px; transition: 0.3s; background: rgba(255, 0, 153, 0.1); }
        .back-btn:hover { background-color: #ff0099; color: #fff; box-shadow: 0 0 25px #ff0099; }

        h1 { font-family: 'Orbitron'; font-size: 3.5rem; text-shadow: 0 0 20px #ff0099; color: #ff0099; margin-bottom: 30px; margin-top: 40px; }

        /* STATUS BAR */
        .status-bar { 
            margin-bottom: 15px; font-family: 'Orbitron'; font-size: 1.2rem; color: #ff0099; 
            display: flex; gap: 30px; width: 800px; justify-content: space-between;
        }
        .status-val { color: #fff; text-shadow: 0 0 10px #ff0099; }

        /* GAME CANVAS */
        #flowCanvas {
            background: rgba(20, 0, 10, 0.9);
            border: 2px solid #ff0099;
            box-shadow: 0 0 40px rgba(255, 0, 153, 0.2);
            border-radius: 5px;
            cursor: pointer; /* Indicates clickable */
        }

        .controls-area { margin-top: 30px; display: flex; gap: 20px; }
        button {
            padding: 10px 30px; font-family: 'Orbitron'; font-size: 1rem; color: #fff; background: #ff0099;
            border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 20px #ff0099; transition: 0.3s;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px #ff0099; }
        
        .btn-guide { background: transparent; border: 2px solid #ff0099; color: #ff0099; }
        .btn-guide:hover { background: #ff0099; color: #fff; }

        .swal-custom-popup { background: #0a0a0a !important; border: 2px solid #ff0099 !important; }
        .swal-custom-title { color: #ff0099 !important; font-family: 'Orbitron' !important; }
        .swal-custom-content { color: #ccc !important; font-family: 'Rajdhani' !important; font-size: 1.1rem; text-align: left;}
    </style>
</head>
<body>
    <canvas id="neural-bg"></canvas>
    <div class="scanlines"></div>

    <a href="/" class="back-btn">← DASHBOARD</a>
    <h1>NEON FLOW</h1>

    <div class="status-bar">
        <div>TOTAL FLOW: <span id="total-flow" class="status-val">0</span></div>
        <div>PATH: <span id="current-path" class="status-val">SELECT SRC</span></div>
    </div>

    <canvas id="flowCanvas" width="800" height="500"></canvas>

    <div class="controls-area">
        <button class="btn-guide" onclick="showGuide()">MISSION BRIEF</button>
        <button onclick="initGraph()">RESET NETWORK</button>
        <button onclick="runAI()">AI AUTO-COMPLETE</button>
    </div>

    <script>
        const bgCanvas = document.getElementById('neural-bg'); const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        let particles=[]; class Particle{constructor(){this.x=Math.random()*bgCanvas.width;this.y=Math.random()*bgCanvas.height;this.size=Math.random()*2;this.speedX=(Math.random()*1.0)-0.5;this.speedY=(Math.random()*1.0)-0.5;this.color='#ff0099';}update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>bgCanvas.width)this.speedX*=-1;if(this.y<0||this.y>bgCanvas.height)this.speedY*=-1;}draw(){bgCtx.fillStyle=this.color;bgCtx.beginPath();bgCtx.arc(this.x,this.y,this.size,0,Math.PI*2);bgCtx.fill();}}
        function initBg(){particles=[];for(let i=0;i<60;i++)particles.push(new Particle());}
        function animateBg(){bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);for(let i=0;i<particles.length;i++){particles[i].update();particles[i].draw();connect(i);}requestAnimationFrame(animateBg);}
        function connect(a){for(let b=a;b<particles.length;b++){let dist=((particles[a].x-particles[b].x)**2+(particles[a].y-particles[b].y)**2);if(dist<(bgCanvas.width/7)*(bgCanvas.height/7)){bgCtx.strokeStyle='rgba(255, 0, 153,'+(1-dist/25000)+')';bgCtx.lineWidth=1;bgCtx.beginPath();bgCtx.moveTo(particles[a].x,particles[a].y);bgCtx.lineTo(particles[b].x,particles[b].y);bgCtx.stroke();}}}
        window.addEventListener('resize',()=>{bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight;initBg();});initBg(); animateBg();
    </script>

    <script>
        const canvas = document.getElementById('flowCanvas');
        const ctx = canvas.getContext('2d');
        
        let nodes = [];
        let edges = [];
        let manualPath = [];
        let totalFlow = 0;
        let isDragging = false;
        let dragNode = null;
        let isProcessing = false;

        // --- INITIALIZATION ---
        function initGraph() {
            nodes = [];
            edges = [];
            manualPath = [];
            totalFlow = 0;
            isProcessing = false;
            document.getElementById('total-flow').innerText = "0";
            document.getElementById('current-path').innerText = "SELECT SRC";
            
            // Layout Nodes
            nodes.push({id: 0, x: 100, y: 250, label: "SRC", layer: 0}); // Source
            nodes.push({id: 7, x: 700, y: 250, label: "SNK", layer: 3}); // Sink
            
            // Middle Nodes (Random positions)
            for(let i=1; i<=6; i++) {
                nodes.push({
                    id: i,
                    x: Math.random() * 400 + 200, 
                    y: Math.random() * 400 + 50,
                    label: "N"+i, 
                    layer: (i <= 3) ? 1 : 2
                });
            }
            
            // Create Edges
            // SRC -> Layer 1
            for(let i=1; i<=3; i++) edges.push(createEdge(0, i));
            // Layer 1 -> Layer 2
            for(let i=1; i<=3; i++) {
                for(let j=4; j<=6; j++) {
                    if(Math.random() > 0.4) edges.push(createEdge(i, j));
                }
            }
            // Layer 2 -> SNK
            for(let i=4; i<=6; i++) edges.push(createEdge(i, 7));
            
            draw();
        }

        function createEdge(u, v) {
            return {
                source: u, target: v,
                capacity: Math.floor(Math.random() * 20) + 5,
                flow: 0
            };
        }

        // --- RENDERING ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Edges
            edges.forEach(e => {
                let p1 = nodes.find(n => n.id === e.source);
                let p2 = nodes.find(n => n.id === e.target);
                
                // Color logic
                let isFull = e.flow >= e.capacity;
                let strokeColor = isFull ? "#550033" : "#444"; // Dark if full
                
                // Highlight Manual Path Edges
                let inManualPath = false;
                for(let i=0; i<manualPath.length-1; i++) {
                    if(manualPath[i] === e.source && manualPath[i+1] === e.target) inManualPath = true;
                }
                if(inManualPath) strokeColor = "#fff";

                // Base line
                ctx.beginPath();
                ctx.lineWidth = 4;
                ctx.strokeStyle = strokeColor;
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                
                // Flow Overlay (Cyan/Pink)
                if(e.flow > 0) {
                    ctx.beginPath();
                    ctx.lineWidth = 2;
                    let flowColor = isFull ? "#ff0099" : "#00ffff"; // Pink = Maxed, Cyan = Flowing
                    ctx.strokeStyle = flowColor;
                    ctx.shadowBlur = 10; ctx.shadowColor = flowColor;
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Capacity Text
                let midX = (p1.x + p2.x)/2;
                let midY = (p1.y + p2.y)/2;
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(midX-15, midY-8, 30, 16);
                ctx.fillStyle = isFull ? "#ff0099" : "#fff";
                ctx.font = "12px monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(`${e.flow}/${e.capacity}`, midX, midY);
            });

            // Draw Nodes
            nodes.forEach(n => {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 20, 0, Math.PI*2);
                
                // Highlight Selection
                let isActive = manualPath.includes(n.id);
                ctx.fillStyle = isActive ? "#fff" : ((n.id === 0 || n.id === 7) ? "#ff0099" : "#220011");
                ctx.fill();
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = isActive ? "#fff" : "#ff0099";
                if(isActive) { ctx.shadowBlur = 15; ctx.shadowColor = "#fff"; }
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = isActive ? "#000" : "#fff";
                ctx.font = "bold 12px Orbitron";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(n.label, n.x, n.y);
            });
        }

        // --- INTERACTIVITY (DRAG & MANUAL PLAY) ---
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', startInteract);
        canvas.addEventListener('touchstart', startInteract, {passive: false});

        function startInteract(e) {
            e.preventDefault(); // Prevent scrolling on touch
            if(isProcessing) return; // Lock if AI running

            const pos = getMousePos(e);
            
            // Check Node Hit
            let hitNode = nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 25);
            
            if(hitNode) {
                // If holding mouse down, assume dragging intent immediately? 
                // Or checking click. Let's start dragging logic.
                isDragging = true;
                dragNode = hitNode;
                
                // Logic: Is this a click to route?
                handleNodeClick(hitNode.id);
            }
        }

        canvas.addEventListener('mousemove', dragInteract);
        canvas.addEventListener('touchmove', dragInteract, {passive: false});

        function dragInteract(e) {
            if(isDragging && dragNode) {
                e.preventDefault();
                const pos = getMousePos(e);
                dragNode.x = pos.x;
                dragNode.y = pos.y;
                draw();
            }
        }

        window.addEventListener('mouseup', () => { isDragging = false; dragNode = null; });
        window.addEventListener('touchend', () => { isDragging = false; dragNode = null; });

        function handleNodeClick(id) {
            // Manual Path Logic
            if(manualPath.length === 0) {
                if(id === 0) { // Must start at SRC
                    manualPath.push(id);
                    updatePathUI();
                } else {
                    Swal.fire({ toast: true, position: 'top-end', title: 'Start at SRC', icon: 'info', timer: 1000, showConfirmButton: false, background: '#000', color: '#fff'});
                }
            } else {
                let lastNode = manualPath[manualPath.length - 1];
                
                // Undo if clicking last node
                if(id === lastNode && manualPath.length > 1) {
                    manualPath.pop();
                    updatePathUI();
                    draw();
                    return;
                }
                
                if(manualPath.includes(id)) return; // No loops

                // Check connection
                let edge = edges.find(e => e.source === lastNode && e.target === id);
                if(edge) {
                    if(edge.capacity - edge.flow > 0) {
                        manualPath.push(id);
                        updatePathUI();
                        
                        // If SNK reached, push flow
                        if(id === 7) {
                            pushManualFlow();
                        }
                    } else {
                        Swal.fire({ toast: true, position: 'top-end', title: 'Pipe Full!', icon: 'error', timer: 1000, showConfirmButton: false, background: '#000', color: '#ff0099'});
                    }
                }
            }
            draw();
        }

        function updatePathUI() {
            let labels = manualPath.map(id => nodes.find(n => n.id === id).label);
            document.getElementById('current-path').innerText = labels.join(" → ");
        }

        function pushManualFlow() {
            // Calculate Bottleneck
            let bottleneck = Infinity;
            let pathEdges = [];
            
            for(let i=0; i<manualPath.length-1; i++) {
                let u = manualPath[i];
                let v = manualPath[i+1];
                let edge = edges.find(e => e.source === u && e.target === v);
                let remaining = edge.capacity - edge.flow;
                if(remaining < bottleneck) bottleneck = remaining;
                pathEdges.push(edge);
            }

            // Update Flow
            pathEdges.forEach(e => e.flow += bottleneck);
            totalFlow += bottleneck;
            document.getElementById('total-flow').innerText = totalFlow;
            
            Swal.fire({
                title: 'FLOW PUSHED',
                text: `+${bottleneck} units added.`,
                background: '#0a0a0a', color: '#ff0099', icon: 'success',
                timer: 1000, showConfirmButton: false
            });

            // Reset path selection
            manualPath = [];
            updatePathUI();
            draw();
        }

        // --- AI SOLVER ---
        function runAI() {
            if(isProcessing) return;
            isProcessing = true;
            
            // Send current state to backend (simplified: just send structure, AI calculates ideal max flow)
            // Note: Since we modified flows manually, let's reset flows for the AI demonstration OR
            // keep current flow. For "Auto-Complete", we should just continue filling.
            
            // To keep it simple and robust, we reset flow visually and let AI animate FULL solution
            edges.forEach(e => e.flow = 0);
            totalFlow = 0;
            document.getElementById('total-flow').innerText = 0;
            
            fetch('/solve_flow', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nodes: nodes, edges: edges })
            })
            .then(res => res.json())
            .then(data => {
                animateFlow(data.steps, data.max_flow);
            });
        }

        function animateFlow(steps, maxTotal) {
            let i = 0;
            function nextStep() {
                if(i >= steps.length) {
                    isProcessing = false;
                    // ** CLEAR SUCCESS MESSAGE **
                    Swal.fire({
                        title: "SYSTEM SATURATED",
                        text: `Maximum Network Capacity: ${maxTotal} units.`,
                        background: '#0a0a0a', color: '#ff0099', icon: 'success',
                        confirmButtonText: 'RESET', confirmButtonColor: '#ff0099'
                    });
                    return;
                }
                
                let step = steps[i];
                let path = step.path;
                let flowAmt = step.flow;
                
                totalFlow += flowAmt;
                document.getElementById('total-flow').innerText = totalFlow;

                for(let k=0; k<path.length-1; k++) {
                    let u = path[k];
                    let v = path[k+1];
                    let edge = edges.find(e => e.source === u && e.target === v);
                    if(edge) edge.flow += flowAmt;
                }
                draw();
                i++;
                setTimeout(nextStep, 300); // Speed
            }
            nextStep();
        }

        function showGuide() {
            Swal.fire({
                title: 'MISSION BRIEF',
                html: `
                    <ul style="list-style: none; padding: 0; text-align: left;">
                        <li style="margin-bottom: 10px;">► <strong>MANUAL MODE:</strong> Click nodes (SRC -> N1 -> ...) to build a path. Click SNK to push data.</li>
                        <li style="margin-bottom: 10px;">► <strong>DRAG:</strong> Click and hold any node to rearrange the graph layout.</li>
                        <li style="margin-bottom: 10px;">► <strong>GOAL:</strong> Saturate the pipes until no more data fits.</li>
                    </ul>
                `,
                background: '#0a0a0a', color: '#ff0099',
                confirmButtonText: 'ACKNOWLEDGED',
                confirmButtonColor: '#ff0099',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', content: 'swal-custom-content' }
            });
        }

        initGraph();
    </script>

<!-- ═══════════════════════════════════════════════
     NEURAL ARENA — UNIVERSAL ENHANCEMENTS v1.0
     1) Page Transition  2) Btn Particle Burst
     3) UI Sounds        4) Achievement System
═══════════════════════════════════════════════ -->
<div id="na-transition-overlay" style="
  position:fixed;inset:0;z-index:999999;
  background:#000;opacity:0;pointer-events:none;
  transition:opacity .3s ease;
"></div>

<div id="na-achievement-toast" style="
  position:fixed;bottom:28px;right:28px;z-index:999998;
  background:rgba(0,0,0,.92);border:1px solid var(--ac,#00ffcc);
  border-radius:8px;padding:12px 18px;font-family:'Orbitron',monospace;
  font-size:.72rem;color:var(--ac,#00ffcc);letter-spacing:2px;
  box-shadow:0 0 24px var(--ac,#00ffcc);
  opacity:0;transform:translateY(16px);
  transition:opacity .35s,transform .35s;pointer-events:none;
  display:flex;align-items:center;gap:10px;
"></div>

<script>
(function(){
'use strict';

/* ── 0. Detect accent colour from back-btn ─────────────────────────── */
const accentDetect = () => {
  const bb = document.querySelector('.back-btn');
  if(!bb) return '#00ffcc';
  const s = getComputedStyle(bb);
  return s.color || '#00ffcc';
};
const ACCENT = accentDetect();
document.documentElement.style.setProperty('--ac', ACCENT);

/* ── 1. PAGE TRANSITION ────────────────────────────────────────────── */
const overlay = document.getElementById('na-transition-overlay');
overlay.style.borderColor = ACCENT;

function navigateWithTransition(href){
  if(!href || href === '#') return;
  overlay.style.pointerEvents = 'all';
  overlay.style.opacity = '1';
  setTimeout(() => { window.location.href = href; }, 310);
}

// Intercept back-btn clicks
document.addEventListener('click', e => {
  const btn = e.target.closest('.back-btn');
  if(btn && btn.href){
    e.preventDefault();
    playWhoosh();
    navigateWithTransition(btn.href);
  }
}, true);

// Fade-in on arrival
window.addEventListener('DOMContentLoaded', () => {
  overlay.style.transition = 'none';
  overlay.style.opacity = '1';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.style.transition = 'opacity .35s ease';
      overlay.style.opacity = '0';
    });
  });
});

/* ── 2. BACK-BTN HOVER PARTICLE BURST ──────────────────────────────── */
const bgCv = document.getElementById('neural-bg');

function spawnBurstParticle(x, y){
  if(!bgCv) return;
  const angle = Math.random() * Math.PI * 2;
  const speed = 2 + Math.random() * 3.5;
  const life  = { v: 1 };
  const px = x - bgCv.getBoundingClientRect().left;
  const py = y - bgCv.getBoundingClientRect().top;
  let vx = Math.cos(angle) * speed;
  let vy = Math.sin(angle) * speed;
  let cx = px, cy = py;
  const ctx2 = bgCv.getContext('2d');

  function draw(){
    if(life.v <= 0) return;
    ctx2.save();
    ctx2.globalAlpha = life.v * 0.8;
    ctx2.fillStyle = ACCENT;
    ctx2.shadowColor = ACCENT;
    ctx2.shadowBlur = 6;
    ctx2.beginPath();
    ctx2.arc(cx, cy, 3 * life.v, 0, Math.PI*2);
    ctx2.fill();
    ctx2.restore();
    cx += vx; cy += vy;
    vx *= 0.92; vy *= 0.92;
    life.v -= 0.045;
    requestAnimationFrame(draw);
  }
  draw();
}

document.addEventListener('mouseenter', e => {
  const btn = e.target.closest('.back-btn');
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top  + r.height/2;
  for(let i=0; i<8; i++) spawnBurstParticle(cx, cy);
}, true);

/* ── 3. UI SOUNDS (Web Audio, no files) ────────────────────────────── */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx) try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  return _audioCtx;
}

function playWhoosh(){
  const ac = getAudioCtx(); if(!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * .25, ac.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800; f.Q.value=0.5;
  const g = ac.createGain(); g.gain.setValueAtTime(.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.25);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}

function playBeep(freq=1100, dur=.09){
  const ac = getAudioCtx(); if(!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.6, ac.currentTime+dur);
  g.gain.setValueAtTime(.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur);
}

function playConfirm(){
  playBeep(880, .06);
  setTimeout(()=>playBeep(1320,.06), 70);
}

// Wire sounds to AI / action buttons (exclude back-btn — already has whoosh)
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  if(btn.closest('#na-achievement-toast')) return;
  const txt = (btn.innerText||'').toLowerCase();
  // whoosh for nav/reset, confirm beep for AI/action
  if(txt.includes('ai') || txt.includes('run') || txt.includes('solve') ||
     txt.includes('evolve') || txt.includes('decrypt') || txt.includes('submit') ||
     txt.includes('recursion') || txt.includes('pilot') || txt.includes('tactical') ||
     txt.includes('encrypt') || txt.includes('cluster') || txt.includes('paint') ||
     txt.includes('step') || txt.includes('next') || txt.includes('shield') ||
     txt.includes('scan') || txt.includes('tour')) {
    playConfirm();
  } else if(txt.includes('reset') || txt.includes('restart') || txt.includes('reboot') ||
            txt.includes('clear') || txt.includes('new') || txt.includes('scramble') ||
            txt.includes('randomize') || txt.includes('reload')) {
    playWhoosh();
  } else {
    playBeep(660, .05); // generic click tick
  }
}, true);

/* ── 4. ACHIEVEMENT SYSTEM ─────────────────────────────────────────── */
const toast = document.getElementById('na-achievement-toast');
let toastTimer = null;

function showAchievement(icon, title, desc){
  toast.innerHTML = `<span style="font-size:1.4rem">${icon}</span><div><div style="color:var(--ac,#00ffcc);letter-spacing:2px">${title}</div><div style="color:#aaa;font-size:.62rem;margin-top:2px;letter-spacing:1px">${desc}</div></div>`;
  toast.style.opacity = '1';
  toast.style.transform = 'translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(16px)';
  }, 3500);
}

function unlockAchievement(key, icon, title, desc){
  const stored = JSON.parse(localStorage.getItem('na_achievements') || '{}');
  if(stored[key]) return false; // already earned
  stored[key] = { ts: Date.now(), title, desc };
  localStorage.setItem('na_achievements', JSON.stringify(stored));
  showAchievement(icon, title, desc);
  return true;
}

// Expose globally so per-game code can call it
window.NA = window.NA || {};
window.NA.unlockAchievement = unlockAchievement;
window.NA.playBeep     = playBeep;
window.NA.playConfirm  = playConfirm;
window.NA.playWhoosh   = playWhoosh;
window.NA.navigateTo   = navigateWithTransition;

})();
</script>


<script>
/* flow achievements */
(function(){
  const origFetch = window.fetch;
  let flowRun = false;
  window.fetch = function(...args){
    if(!flowRun && args[0]&&args[0].includes('solve_flow')){
      flowRun = true;
      window.NA.unlockAchievement('flow_first','🌊','MAX FLOW','Ran Edmonds-Karp algorithm!');
    }
    return origFetch.apply(this,args);
  };
  // Scramble achievement
  const origScramble = window.scrambleGraph;
  if(origScramble) window.scrambleGraph = function(){
    window.NA.unlockAchievement('flow_scramble','🔀','NETWORK CHAOS','Scrambled the flow network!');
    origScramble();
  };
})();
</script>
