<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL ARENA | Neon Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020202; color: #fff; font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; overflow-y: auto; padding-top: 20px; padding-bottom: 50px;
            user-select: none;
        }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at center, #1a0022 0%, #000 100%); }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: -1; opacity: 0.3; }

        .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; color: #9400d3; font-family: 'Orbitron'; font-size: 1rem; border: 1px solid #9400d3; padding: 10px 20px; border-radius: 5px; transition: 0.3s; background: rgba(148, 0, 211, 0.1); }
        .back-btn:hover { background-color: #9400d3; color: #fff; box-shadow: 0 0 25px #9400d3; }

        h1 { font-family: 'Orbitron'; font-size: 3.5rem; text-shadow: 0 0 20px #9400d3; color: #9400d3; margin-bottom: 30px; margin-top: 40px; }

        /* MEMORY GRID */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 15px;
            perspective: 1000px;
        }

        .card-slot {
            width: 100px; height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .card-slot.flipped { transform: rotateY(180deg); }
        .card-slot.matched { visibility: hidden; opacity: 0; transition: visibility 0s 0.5s, opacity 0.5s; }

        .front, .back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; box-shadow: 0 0 15px rgba(148, 0, 211, 0.3);
        }

        .front {
            background: #111;
            border: 2px solid #9400d3;
            color: #9400d3;
            font-family: 'Orbitron';
        }

        .back {
            background: #9400d3;
            color: #fff;
            transform: rotateY(180deg);
            border: 2px solid #fff;
            text-shadow: 0 0 10px #fff;
        }

        .controls-area { margin-top: 40px; display: flex; gap: 20px; }
        button {
            padding: 10px 30px; font-family: 'Orbitron'; font-size: 1rem; color: #fff; background: #9400d3;
            border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 20px #9400d3; transition: 0.3s;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px #9400d3; }
        .btn-guide { background: transparent; border: 2px solid #9400d3; color: #9400d3; }
        .btn-guide:hover { background: #9400d3; color: #fff; }

        .score-board {
            margin-bottom: 20px; font-family: 'Orbitron'; font-size: 1.5rem; color: #fff;
            display: flex; gap: 40px;
        }
        .active-turn { color: #9400d3; text-shadow: 0 0 15px #9400d3; border-bottom: 2px solid #9400d3; }

        .swal-custom-popup { background: #0a0a0a !important; border: 2px solid #9400d3 !important; }
        .swal-custom-title { color: #9400d3 !important; font-family: 'Orbitron' !important; }
        .swal-custom-content { color: #ccc !important; font-family: 'Rajdhani' !important; font-size: 1.1rem; text-align: left;}
    </style>
</head>
<body>
    <canvas id="neural-bg"></canvas>
    <div class="scanlines"></div>

    <a href="/" class="back-btn">← DASHBOARD</a>
    <h1>NEON MATCH</h1>

    <div class="score-board">
        <div id="p-score" class="active-turn">PLAYER: 0</div>
        <div id="ai-score">AI AGENT: 0</div>
    </div>

    <div id="game-grid"></div>

    <div class="controls-area">
        <button class="btn-guide" onclick="showGuide()">MISSION BRIEF</button>
        <button onclick="initGame()">RESET SYSTEM</button>
    </div>

    <script>
        const bgCanvas = document.getElementById('neural-bg'); const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        let particles=[]; class Particle{constructor(){this.x=Math.random()*bgCanvas.width;this.y=Math.random()*bgCanvas.height;this.size=Math.random()*2;this.speedX=(Math.random()*1.0)-0.5;this.speedY=(Math.random()*1.0)-0.5;this.color='#9400d3';}update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>bgCanvas.width)this.speedX*=-1;if(this.y<0||this.y>bgCanvas.height)this.speedY*=-1;}draw(){bgCtx.fillStyle=this.color;bgCtx.beginPath();bgCtx.arc(this.x,this.y,this.size,0,Math.PI*2);bgCtx.fill();}}
        function initBg(){particles=[];for(let i=0;i<60;i++)particles.push(new Particle());}
        function animateBg(){bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);for(let i=0;i<particles.length;i++){particles[i].update();particles[i].draw();connect(i);}requestAnimationFrame(animateBg);}
        function connect(a){for(let b=a;b<particles.length;b++){let dist=((particles[a].x-particles[b].x)**2+(particles[a].y-particles[b].y)**2);if(dist<(bgCanvas.width/7)*(bgCanvas.height/7)){bgCtx.strokeStyle='rgba(148, 0, 211,'+(1-dist/25000)+')';bgCtx.lineWidth=1;bgCtx.beginPath();bgCtx.moveTo(particles[a].x,particles[a].y);bgCtx.lineTo(particles[b].x,particles[b].y);bgCtx.stroke();}}}
        window.addEventListener('resize',()=>{bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight;initBg();});initBg(); animateBg();
    </script>

    <script>
        const ICONS = ['⚡', '☢', '☣', '☯', '★', '☾', '☀', '☁'];
        let cards = []; // {id, icon, matched}
        let flipped = [];
        let aiMemory = {}; // { id: icon } - AI remembers what it has seen
        let turn = 'player'; // 'player' or 'ai'
        let scores = {player: 0, ai: 0};
        let isLocked = false;

        function initGame() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            cards = [];
            flipped = [];
            aiMemory = {};
            scores = {player: 0, ai: 0};
            updateScoreUI();
            turn = 'player';
            setTurnUI();

            // Create pairs
            let deck = [...ICONS, ...ICONS];
            // Shuffle
            deck.sort(() => Math.random() - 0.5);

            deck.forEach((icon, i) => {
                let card = document.createElement('div');
                card.className = 'card-slot';
                card.id = `card-${i}`;
                card.onclick = () => handleCardClick(i);
                
                card.innerHTML = `
                    <div class="front">?</div>
                    <div class="back">${icon}</div>
                `;
                
                grid.appendChild(card);
                cards.push({id: i, icon: icon, matched: false});
            });
        }

        function handleCardClick(idx) {
            if(isLocked || turn !== 'player') return;
            if(cards[idx].matched || flipped.includes(idx)) return;

            flipCard(idx);
            
            if(flipped.length === 2) {
                checkMatch();
            }
        }

        function flipCard(idx) {
            let el = document.getElementById(`card-${idx}`);
            el.classList.add('flipped');
            flipped.push(idx);
            
            // AI observes this flip
            aiMemory[idx] = cards[idx].icon;
        }

        function checkMatch() {
            isLocked = true;
            let id1 = flipped[0];
            let id2 = flipped[1];
            
            if(cards[id1].icon === cards[id2].icon) {
                // Match!
                scores[turn]++;
                updateScoreUI();
                cards[id1].matched = true;
                cards[id2].matched = true;
                
                setTimeout(() => {
                    document.getElementById(`card-${id1}`).classList.add('matched');
                    document.getElementById(`card-${id2}`).classList.add('matched');
                    flipped = [];
                    isLocked = false;
                    checkWin();
                    
                    // If AI made a match, it goes again (standard rules). 
                    // But to keep it simple/fair for demo, let's alternate turns always? 
                    // Standard rule: match = go again. Let's do Alternate to give player a chance.
                    switchTurn(); 
                }, 1000);
            } else {
                // No Match
                setTimeout(() => {
                    document.getElementById(`card-${id1}`).classList.remove('flipped');
                    document.getElementById(`card-${id2}`).classList.remove('flipped');
                    flipped = [];
                    isLocked = false;
                    switchTurn();
                }, 1000);
            }
        }

        function switchTurn() {
            turn = turn === 'player' ? 'ai' : 'player';
            setTurnUI();
            if(turn === 'ai') {
                setTimeout(aiTurn, 1000);
            }
        }

        function aiTurn() {
            // 1. Check memory for a guaranteed pair
            // Look for any icon in memory that appears twice at different IDs
            let knownPairs = {};
            let matchFound = null;

            // Find unmatched cards
            let availableIds = cards.filter(c => !c.matched).map(c => c.id);
            if(availableIds.length === 0) return;

            // Scan memory for pairs
            for(let id in aiMemory) {
                if(cards[id].matched) continue;
                let icon = aiMemory[id];
                if(knownPairs[icon]) {
                    // We found a pair we know!
                    matchFound = [parseInt(knownPairs[icon]), parseInt(id)];
                    break;
                }
                knownPairs[icon] = id;
            }

            if(matchFound) {
                // Execute Perfect Memory
                flipCard(matchFound[0]);
                setTimeout(() => {
                    flipCard(matchFound[1]);
                    checkMatch();
                }, 800);
            } else {
                // Guessing Phase
                // Pick a random unknown card
                let unknownIds = availableIds.filter(id => !aiMemory[id]);
                // If we know everything but haven't paired them (rare edge case), pick from available
                let pick1 = unknownIds.length > 0 
                    ? unknownIds[Math.floor(Math.random() * unknownIds.length)]
                    : availableIds[Math.floor(Math.random() * availableIds.length)];
                
                flipCard(pick1);
                
                setTimeout(() => {
                    // Now check memory again! Did we just reveal a card we know the partner of?
                    let icon1 = cards[pick1].icon;
                    let partnerId = null;
                    
                    for(let id in aiMemory) {
                        if(parseInt(id) !== pick1 && !cards[id].matched && aiMemory[id] === icon1) {
                            partnerId = parseInt(id);
                            break;
                        }
                    }
                    
                    if(partnerId !== null) {
                        // AI remembers the partner!
                        flipCard(partnerId);
                    } else {
                        // Still don't know. Random guess 2.
                        let remaining = availableIds.filter(id => id !== pick1);
                        let pick2 = remaining[Math.floor(Math.random() * remaining.length)];
                        flipCard(pick2);
                    }
                    checkMatch();
                }, 800);
            }
        }

        function setTurnUI() {
            document.getElementById('p-score').className = turn === 'player' ? 'active-turn' : '';
            document.getElementById('ai-score').className = turn === 'ai' ? 'active-turn' : '';
        }

        function updateScoreUI() {
            document.getElementById('p-score').innerText = `PLAYER: ${scores.player}`;
            document.getElementById('ai-score').innerText = `AI AGENT: ${scores.ai}`;
        }

        function checkWin() {
            let total = scores.player + scores.ai;
            if(total === 8) { // 8 pairs
                let msg = scores.player > scores.ai ? "YOU WIN" : (scores.ai > scores.player ? "AI WINS" : "DRAW");
                Swal.fire({
                    title: msg,
                    text: `Final Score - Player: ${scores.player} | AI: ${scores.ai}`,
                    background: '#0a0a0a', color: '#9400d3', icon: 'info'
                });
            }
        }

        function showGuide() {
            Swal.fire({
                title: 'MISSION BRIEF',
                html: `
                    <ul style="list-style: none; padding: 0; text-align: left;">
                        <li style="margin-bottom: 10px;">► <strong>GOAL:</strong> Find matching pairs of symbols.</li>
                        <li style="margin-bottom: 10px;">► <strong>AI OPPONENT:</strong> The AI watches every move. If you reveal a card it has seen before, it remembers the location perfectly.</li>
                        <li style="margin-bottom: 10px;">► <strong>STRATEGY:</strong> Don't just guess randomly—try to remember positions so you can beat the AI to the match.</li>
                    </ul>
                `,
                background: '#0a0a0a', color: '#9400d3',
                confirmButtonText: 'ACKNOWLEDGED',
                confirmButtonColor: '#9400d3',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', content: 'swal-custom-content' }
            });
        }

        initGame();
    </script>

<!-- ═══════════════════════════════════════════════
     NEURAL ARENA — UNIVERSAL ENHANCEMENTS v1.0
     1) Page Transition  2) Btn Particle Burst
     3) UI Sounds        4) Achievement System
═══════════════════════════════════════════════ -->
<div id="na-transition-overlay" style="
  position:fixed;inset:0;z-index:999999;
  background:#000;opacity:0;pointer-events:none;
  transition:opacity .3s ease;
"></div>

<div id="na-achievement-toast" style="
  position:fixed;bottom:28px;right:28px;z-index:999998;
  background:rgba(0,0,0,.92);border:1px solid var(--ac,#00ffcc);
  border-radius:8px;padding:12px 18px;font-family:'Orbitron',monospace;
  font-size:.72rem;color:var(--ac,#00ffcc);letter-spacing:2px;
  box-shadow:0 0 24px var(--ac,#00ffcc);
  opacity:0;transform:translateY(16px);
  transition:opacity .35s,transform .35s;pointer-events:none;
  display:flex;align-items:center;gap:10px;
"></div>

<script>
(function(){
'use strict';

/* ── 0. Detect accent colour from back-btn ─────────────────────────── */
const accentDetect = () => {
  const bb = document.querySelector('.back-btn');
  if(!bb) return '#00ffcc';
  const s = getComputedStyle(bb);
  return s.color || '#00ffcc';
};
const ACCENT = accentDetect();
document.documentElement.style.setProperty('--ac', ACCENT);

/* ── 1. PAGE TRANSITION ────────────────────────────────────────────── */
const overlay = document.getElementById('na-transition-overlay');
overlay.style.borderColor = ACCENT;

function navigateWithTransition(href){
  if(!href || href === '#') return;
  overlay.style.pointerEvents = 'all';
  overlay.style.opacity = '1';
  setTimeout(() => { window.location.href = href; }, 310);
}

// Intercept back-btn clicks
document.addEventListener('click', e => {
  const btn = e.target.closest('.back-btn');
  if(btn && btn.href){
    e.preventDefault();
    playWhoosh();
    navigateWithTransition(btn.href);
  }
}, true);

// Fade-in on arrival
window.addEventListener('DOMContentLoaded', () => {
  overlay.style.transition = 'none';
  overlay.style.opacity = '1';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.style.transition = 'opacity .35s ease';
      overlay.style.opacity = '0';
    });
  });
});

/* ── 2. BACK-BTN HOVER PARTICLE BURST ──────────────────────────────── */
const bgCv = document.getElementById('neural-bg');

function spawnBurstParticle(x, y){
  if(!bgCv) return;
  const angle = Math.random() * Math.PI * 2;
  const speed = 2 + Math.random() * 3.5;
  const life  = { v: 1 };
  const px = x - bgCv.getBoundingClientRect().left;
  const py = y - bgCv.getBoundingClientRect().top;
  let vx = Math.cos(angle) * speed;
  let vy = Math.sin(angle) * speed;
  let cx = px, cy = py;
  const ctx2 = bgCv.getContext('2d');

  function draw(){
    if(life.v <= 0) return;
    ctx2.save();
    ctx2.globalAlpha = life.v * 0.8;
    ctx2.fillStyle = ACCENT;
    ctx2.shadowColor = ACCENT;
    ctx2.shadowBlur = 6;
    ctx2.beginPath();
    ctx2.arc(cx, cy, 3 * life.v, 0, Math.PI*2);
    ctx2.fill();
    ctx2.restore();
    cx += vx; cy += vy;
    vx *= 0.92; vy *= 0.92;
    life.v -= 0.045;
    requestAnimationFrame(draw);
  }
  draw();
}

document.addEventListener('mouseenter', e => {
  const btn = e.target.closest('.back-btn');
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top  + r.height/2;
  for(let i=0; i<8; i++) spawnBurstParticle(cx, cy);
}, true);

/* ── 3. UI SOUNDS (Web Audio, no files) ────────────────────────────── */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx) try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  return _audioCtx;
}

function playWhoosh(){
  const ac = getAudioCtx(); if(!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * .25, ac.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800; f.Q.value=0.5;
  const g = ac.createGain(); g.gain.setValueAtTime(.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.25);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}

function playBeep(freq=1100, dur=.09){
  const ac = getAudioCtx(); if(!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.6, ac.currentTime+dur);
  g.gain.setValueAtTime(.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur);
}

function playConfirm(){
  playBeep(880, .06);
  setTimeout(()=>playBeep(1320,.06), 70);
}

// Wire sounds to AI / action buttons (exclude back-btn — already has whoosh)
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  if(btn.closest('#na-achievement-toast')) return;
  const txt = (btn.innerText||'').toLowerCase();
  // whoosh for nav/reset, confirm beep for AI/action
  if(txt.includes('ai') || txt.includes('run') || txt.includes('solve') ||
     txt.includes('evolve') || txt.includes('decrypt') || txt.includes('submit') ||
     txt.includes('recursion') || txt.includes('pilot') || txt.includes('tactical') ||
     txt.includes('encrypt') || txt.includes('cluster') || txt.includes('paint') ||
     txt.includes('step') || txt.includes('next') || txt.includes('shield') ||
     txt.includes('scan') || txt.includes('tour')) {
    playConfirm();
  } else if(txt.includes('reset') || txt.includes('restart') || txt.includes('reboot') ||
            txt.includes('clear') || txt.includes('new') || txt.includes('scramble') ||
            txt.includes('randomize') || txt.includes('reload')) {
    playWhoosh();
  } else {
    playBeep(660, .05); // generic click tick
  }
}, true);

/* ── 4. ACHIEVEMENT SYSTEM ─────────────────────────────────────────── */
const toast = document.getElementById('na-achievement-toast');
let toastTimer = null;

function showAchievement(icon, title, desc){
  toast.innerHTML = `<span style="font-size:1.4rem">${icon}</span><div><div style="color:var(--ac,#00ffcc);letter-spacing:2px">${title}</div><div style="color:#aaa;font-size:.62rem;margin-top:2px;letter-spacing:1px">${desc}</div></div>`;
  toast.style.opacity = '1';
  toast.style.transform = 'translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(16px)';
  }, 3500);
}

function unlockAchievement(key, icon, title, desc){
  const stored = JSON.parse(localStorage.getItem('na_achievements') || '{}');
  if(stored[key]) return false; // already earned
  stored[key] = { ts: Date.now(), title, desc };
  localStorage.setItem('na_achievements', JSON.stringify(stored));
  showAchievement(icon, title, desc);
  return true;
}

// Expose globally so per-game code can call it
window.NA = window.NA || {};
window.NA.unlockAchievement = unlockAchievement;
window.NA.playBeep     = playBeep;
window.NA.playConfirm  = playConfirm;
window.NA.playWhoosh   = playWhoosh;
window.NA.navigateTo   = navigateWithTransition;

})();
</script>


<script>
/* match achievements */
(function(){
  const origCheck = window.checkWin;
  if(origCheck) window.checkWin = function(){
    if((window.scores?.player||0) > (window.scores?.ai||0)){
      window.NA.unlockAchievement('match_win','🏆','MEMORY KING','Beat the AI Memory Agent!');
    }
    if((window.scores?.player||0) === 0 && (window.scores?.ai||0) > 0){
      window.NA.unlockAchievement('match_zero','😱','AMNESIA','Lost with 0 points!');
    }
    origCheck();
  };
  // First successful match
  const origFlip = window.flipCard;
  let firstMatch = false;
  if(origFlip) window.flipCard = function(idx){
    origFlip(idx);
    if(!firstMatch && window.flipped?.length === 2){
      firstMatch = true;
      window.NA.unlockAchievement('match_first','🃏','FIRST MATCH','Flipped your first pair!');
    }
  };
})();
</script>

</body>
</html>
